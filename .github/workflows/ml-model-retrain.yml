name: ML Model Retrain

on:
  push:
    # Retrain on main (release) and legacy feature branch
    branches: [main, feat/ml-pipeline]
  schedule:
    # Run weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write  # push model updates

concurrency:
  group: ml-model-retrain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        run: |
          pip install -r ml-model/requirements.txt

      - name: Build scanner (feature builders are shared with the exporters)
        run: npm run build --workspace=@nullvoid/ts

      - name: Keep previous metadata for the regression check
        run: |
          cp ml-model/metadata.json /tmp/prev-metadata.json
          cp ml-model/behavioral-metadata.json /tmp/prev-behavioral-metadata.json

      # Labels are ground truth: GHSA *malware* advisories = 1, the reviewed
      # benign list = 0. The exporters never label from the scanner's output.
      - name: Export dependency features (GHSA malware + benign list)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ml-model/export-features.js \
            --overwrite \
            --from-ghsa --limit 5000 \
            --good-file ml-model/benign-packages.txt \
            --out ml-model/train.jsonl

      - name: Train dependency model (time-stratified held-out metrics in metadata.json)
        run: |
          cd ml-model && python3 train.py \
            --input train.jsonl \
            --output-dir . \
            --balance \
            --calibrate

      - name: Export behavioral features (GHSA malware + benign list)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ml-model/export-behavioral-features.js \
            --overwrite \
            --from-ghsa --limit 5000 \
            --good-file ml-model/benign-packages.txt \
            --out ml-model/train-behavioral.jsonl

      - name: Train behavioral model
        run: |
          cd ml-model && python3 train-behavioral.py \
            --input train-behavioral.jsonl \
            --output-dir . \
            --balance \
            --calibrate

      # A retrain that produced no metrics, fell below the floors, or regressed
      # more than 5 points of ROC-AUC / PR-AUC against the committed model fails
      # here and nothing is pushed.
      - name: Metrics gate
        run: |
          python3 ml-model/check_metrics.py --metadata ml-model/metadata.json \
            --baseline /tmp/prev-metadata.json --max-regression 0.05 \
            --min-roc-auc 0.9 --min-pr-auc 0.5 --min-recall 0.8
          python3 ml-model/check_metrics.py --metadata ml-model/behavioral-metadata.json \
            --baseline /tmp/prev-behavioral-metadata.json --max-regression 0.05 \
            --min-roc-auc 0.7 --min-pr-auc 0.3

      - name: Check for model changes
        id: changes
        run: |
          git diff --quiet \
            ml-model/train.jsonl ml-model/model.model.json ml-model/model.calib.json ml-model/metadata.json \
            ml-model/train-behavioral.jsonl ml-model/behavioral.model.json ml-model/behavioral.calib.json ml-model/behavioral-metadata.json \
            2>/dev/null && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push model updates
        if: steps.changes.outputs.changed == 'true'
        run: bash .github/scripts/ml-retrain-push.sh "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
