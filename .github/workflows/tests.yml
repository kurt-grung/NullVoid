name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

# Two jobs so PRs show separate status checks (quality vs tests) for branch protection.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Format (Prettier)
        run: npm run format:check

      - name: Verify publish contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'ts/dist/bin/nullvoid.js' /tmp/pack.txt
          ! grep -qE 'ts/(src|test)/' /tmp/pack.txt

      - name: Verify unit test isolation
        run: bash .github/scripts/verify-unit-test-isolation.sh

  benchmark:
    # Detection quality gate: package-level precision/recall on a labelled
    # corpus (ts/benchmark). Fails below the floors in ts/benchmark/baseline.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache benign corpus
        uses: actions/cache@v4
        with:
          path: ts/benchmark/.cache
          key: nullvoid-benchmark-benign-${{ hashFiles('ts/benchmark/benign.json') }}

      - name: Run detection benchmark
        run: npm run benchmark

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ts/benchmark/results.json

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ts/ runs with coverage so the floor in ts/jest.config.js is enforced;
      # the CLI project needs the built binary.
      - name: Build CLI for smoke tests
        run: npm run build --workspace=@nullvoid/ts

      - name: Run tests (ts with coverage floor, api)
        run: |
          npm run test:coverage
          npm run test:api
        env:
          CI: true

      - name: Setup Python for ML eval
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python ML dependencies
        run: python3 -m pip install -r ml-model/requirements.txt

      # train.py / train-behavioral.py hold out the newest 20% of packages per
      # class, record the metrics in metadata.json and refit on all rows.
      # check_metrics.py fails the job on empty metrics or metrics under the floors.
      - name: ML train + held-out evaluation (dependency + behavioral)
        run: |
          cd ml-model
          python3 train.py --input train.jsonl --output-dir /tmp/ml-dep-ci --balance --calibrate
          python3 train-behavioral.py --input train-behavioral.jsonl --output-dir /tmp/ml-beh-ci --balance --calibrate
          python3 check_metrics.py --metadata /tmp/ml-dep-ci/metadata.json \
            --min-roc-auc 0.9 --min-pr-auc 0.5 --min-recall 0.8 > /tmp/ml-dep-metrics.json
          python3 check_metrics.py --metadata /tmp/ml-beh-ci/behavioral-metadata.json \
            --min-roc-auc 0.7 --min-pr-auc 0.3 > /tmp/ml-beh-metrics.json
          cd ..
          python3 -c "import json, pathlib; p=pathlib.Path('ml-eval-report.json'); p.write_text(json.dumps({'dependency': json.load(open('/tmp/ml-dep-metrics.json')), 'behavioral': json.load(open('/tmp/ml-beh-metrics.json'))}, indent=2))"

      - name: Upload ML eval report
        uses: actions/upload-artifact@v4
        with:
          name: ml-eval-report
          path: ml-eval-report.json
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/
          retention-days: 30
          if-no-files-found: ignore

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run performance benchmarks
        run: npm run test:performance
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          NULLVOID_DB_PATH: /tmp/nullvoid-e2e.db
          NULLVOID_SCAN_ROOT: ${{ github.workspace }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/dashboard/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
